name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android is deliberately NOT used. It runs `sdkmanager tools`,
      # and that package no longer exists in the SDK repository, so the step always fails.
      # The ubuntu-latest image already ships a full SDK with licences accepted, and AGP
      # downloads any missing platform itself.
      - name: Show the preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/licenses" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The debug keystore is created on first use, and a runner starts clean every time: without
      # this cache every run signed the APK with a brand new key, so installing it over the
      # previous one failed with "App not installed" and the app had to be uninstalled first —
      # which, with backups off, also threw the vault away. One stable key makes an update an
      # ordinary update.
      #
      # The path is inside the workspace and is the same one app/build.gradle.kts pins, rather than
      # whichever directory AGP would have picked on this machine.
      - name: Cache the debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: android-debug-keystore-v1

      # Only ever runs while the cache is cold, so the key outlives every later run.
      - name: Create the debug keystore if it is not cached yet
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Test and build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
